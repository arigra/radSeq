# E0 with a standard video-DiT setup: spatial + temporal (factorized)
# attention, no smoothness loss. Paired with e0_temp_s0.yaml (attention mode
# is the only difference). Sample with terminal_x0=mean
# (docs/notes/2026-09-14-terminal-step-diagnosis.md).
data:
  n_train: 20000
  n_val: 2000
  seq_len: 16
  frame_interval: 0.5
  cache_dir: data/cache_easy
  shard_size: 1000
  seed: 1234
model:
  patch: 8
  stride: 4
  dim: 256
  depth: 8
  heads: 8
  attn_mode: factorized
diffusion:
  timesteps: 1000
  terminal_x0: mean
train:
  seed: 2026
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 10
  lambda_smooth: 0.0
  amp: bf16                  # fp32 factorized peaks at 14.7 GB; ~14.5 GB free
  lambda_traj: 0.01
  lambda_doppler: 0.01
  phase: 1
  ckpt_dir: checkpoints/e0_fact_s0
  log_file: logs/e0_fact_s0.log
  log_every_steps: 50
  save_every_steps: 250
  snapshot_every_epochs: 5
  val_every_epochs: 1
  val_batch_size: 16
  val_seed: 4321
  wandb: false
sample:
  ddim_steps: 50
