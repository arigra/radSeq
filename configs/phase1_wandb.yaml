  early_stopping_patience: 15
  early_stopping_min_delta: 5.0e-4
  wandb: true
  wandb_config:
    project: radSeq
    name: phase1-full-seed2026
    group: phase1-backbone
    job_type: train
    tags:
      - proposal
      - phase1
      - full-data
      - seed-2026
    notes: "Proposal Phase 1: unconditional temporal DiT with denoising and smoothness losses."
    mode: online
sample:
  ddim_steps: 50
