# Research plan step 2: trajectory-conditioned DiT trained ONLY on the first
# 2,000 training sequences, from scratch (no warm start: e3_long saw all 20k).
# Rule: docs/notes/2026-09-17-step2-synthetic-augmentation.md. Run by scripts/run_step2.sh.
data:
  n_train: 20000
  n_val: 2000
  train_subset: 2000
  seq_len: 16
  frame_interval: 0.5
  cache_dir: data/cache
  shard_size: 1000
  seed: 1234
model:
  patch: 8
  stride: 8
  dim: 384
  depth: 12
  heads: 6
  attn_mode: factorized
  cond_channels: 4
diffusion:
  timesteps: 1000
  parameterization: v
  schedule_shift: 4.0
  x0_clamp: "off"
  terminal_x0: model
train:
  seed: 2026
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 640                # 62 steps/epoch -> ~39,700 steps
  lambda_smooth: 0.0
  lambda_traj: 0.01
  lambda_doppler: 0.01
  amp: bf16
  ema_decay: 0.9999
  phase: 1
  cond_dropout: 0.1
  ckpt_dir: checkpoints/cond_traj_n2000
  log_file: logs/cond_traj_n2000.log
  log_every_steps: 200
  save_every_steps: 1000
  snapshot_every_epochs: 160
  val_every_epochs: 80
  val_batch_size: 32
  val_seed: 4321
  wandb: false
sample:
  ddim_steps: 30
  weights: ema
