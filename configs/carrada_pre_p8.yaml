# CARRADA: DiT pretrained on the engineer simulator, patch 8 (run_carrada_gen.sh)
data:
  kind: scene
  cache_dir: data/carrada_sim_engineer
  seq_len: 8
  n_range: 256
  n_doppler: 64
  num_workers: 4
  seed: 1234
model:
  patch: 8
  stride: 8
  dim: 384
  depth: 12
  heads: 6
  attn_mode: factorized
  cond_channels: 2
diffusion:
  timesteps: 1000
  parameterization: v
  schedule_shift: 8.0
  x0_clamp: 'off'
  terminal_x0: mean
train:
  seed: 2026
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0
  epochs: 80
  lambda_smooth: 0.0
  lambda_traj: 0.0
  lambda_doppler: 0.0
  amp: bf16
  ema_decay: 0.9999
  phase: 1
  cond_dropout: 0.1
  ckpt_dir: checkpoints/carrada_pre_p8
  log_file: logs/carrada_pre_p8.log
  log_every_steps: 200
  save_every_steps: 1000
  val_every_epochs: 5
  val_batch_size: 8
  val_seed: 4321
  wandb: false
  snapshot_every_epochs: 10
sample:
  ddim_steps: 30
  weights: ema
