# Longer training of the passing factorized full-data model: resumes a copy of
# the e3_standard checkpoint (step 62,625) to 180 epochs. Rule: docs/notes/2026-09-15-e3-longer-training.md
# v-prediction, resolution-shifted schedule, no x0 clamp, non-overlapping
# patches (no overlap averaging), factorized space-time attention, DiT-S width,
# EMA, no smoothness loss. Run unattended by scripts/run_e3_long.sh.
data:
  n_train: 20000
  n_val: 2000
  seq_len: 16
  frame_interval: 0.5
  cache_dir: data/cache
  shard_size: 1000
  seed: 1234
model:
  patch: 8
  stride: 8
  dim: 384
  depth: 12
  heads: 6
  attn_mode: factorized
diffusion:
  timesteps: 1000
  parameterization: v
  schedule_shift: 4.0        # SNR / 16
  x0_clamp: "off"
  terminal_x0: model         # v-prediction is well-defined at SNR 0
train:
  seed: 2026
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 180                # +80 epochs beyond e3_standard
  lambda_smooth: 0.0
  lambda_traj: 0.01
  lambda_doppler: 0.01
  amp: bf16
  ema_decay: 0.9999
  phase: 1
  ckpt_dir: checkpoints/e3_long
  log_file: logs/e3_long.log
  log_every_steps: 100
  save_every_steps: 1000
  snapshot_every_epochs: 10
  val_every_epochs: 5
  val_batch_size: 32
  val_seed: 4321
  wandb: false
sample:
  ddim_steps: 50
  weights: ema
