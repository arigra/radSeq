# Step 3 pretraining on the engineer scene simulator (RADIal grid, 8 frames).
# Recipe from the 512x256 check (samples/scene_dit_smoke.json): patch 16,
# schedule shift 16 beat shift 4 on dynamic range (50 vs 42 dB, sim 57) and
# showed the DDMA copies, arcs and empty-slot band. 80 epochs = 60k steps.
data:
  kind: scene
  cache_dir: data/scene_engineer
  seq_len: 8
  n_range: 512
  n_doppler: 256
  num_workers: 4
  seed: 1234
model:
  patch: 16
  stride: 16
  dim: 384
  depth: 12
  heads: 6
  attn_mode: factorized
  cond_channels: 2
diffusion:
  timesteps: 1000
  parameterization: v
  schedule_shift: 16.0
  x0_clamp: 'off'
  terminal_x0: mean
train:
  seed: 2026
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0
  epochs: 80
  lambda_smooth: 0.0
  lambda_traj: 0.0
  lambda_doppler: 0.0
  amp: bf16
  ema_decay: 0.9999
  phase: 1
  cond_dropout: 0.1
  ckpt_dir: checkpoints/pretrain_engineer
  log_file: logs/pretrain_engineer.log
  log_every_steps: 200
  save_every_steps: 1000
  val_every_epochs: 5
  val_batch_size: 8
  val_seed: 4321
  wandb: false
sample:
  ddim_steps: 30
  weights: ema
