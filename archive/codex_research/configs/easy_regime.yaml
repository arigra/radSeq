# Easy-regime (E0) arm — pre-registered in
# docs/notes/2026-09-12-easy-regime-preregistration.md
#
# Identical to archive/ablations_aug/configs/phase1_wandb.yaml except for the data it trains on and the
# budget: 10 epochs x 1250 steps = 12,500 steps, matching every earlier ablation
# arm. Data is the ONLY variable under test. Early stopping is off so the budget
# is exactly 12,500 steps rather than whatever validation selects.
data:
  n_train: 20000
  n_val: 2000
  seq_len: 16
  frame_interval: 0.5
  cache_dir: data/cache_easy
  shard_size: 1000
  seed: 1234
model:
  patch: 8
  stride: 4
  dim: 256
  depth: 8
  heads: 8
diffusion:
  timesteps: 1000
train:
  seed: 2026
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 10                 # 12,500 steps at 20k / batch 16
  lambda_smooth: 0.1
  lambda_traj: 0.01
  lambda_doppler: 0.01
  phase: 1
  ckpt_dir: checkpoints/easy_regime
  log_file: archive/codex_research/logs/easy_regime.log
  log_every_steps: 50
  save_every_steps: 250
  snapshot_every_epochs: 10
  val_every_epochs: 1
  val_batch_size: 16
  val_seed: 4321
  wandb: false
sample:
  ddim_steps: 50
