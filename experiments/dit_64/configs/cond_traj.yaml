# Trajectory-conditioned DiT (research plan step 1). Warm-starts from the passing
# unconditional full-data model. Design: docs/superpowers/specs/2026-09-17-trajectory-conditioning-design.md
# Rule: docs/notes/2026-09-17-trajectory-conditioning.md. Run by experiments/dit_64/run_cond_traj.sh.
data:
  n_train: 20000
  n_val: 2000
  seq_len: 16
  frame_interval: 0.5
  cache_dir: data/cache
  shard_size: 1000
  seed: 1234
model:
  patch: 8
  stride: 8
  dim: 384
  depth: 12
  heads: 6
  attn_mode: factorized
  cond_channels: 4           # 3 class blob channels + presence
diffusion:
  timesteps: 1000
  parameterization: v
  schedule_shift: 4.0
  x0_clamp: "off"
  terminal_x0: model
train:
  seed: 2026
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 40                 # 25,000 steps
  lambda_smooth: 0.0
  lambda_traj: 0.01
  lambda_doppler: 0.01
  amp: bf16
  ema_decay: 0.9999
  phase: 1
  init_from: checkpoints/e3_long_bs32/last.pt
  cond_dropout: 0.1
  ckpt_dir: checkpoints/cond_traj
  log_file: experiments/dit_64/logs/cond_traj.log
  log_every_steps: 100
  save_every_steps: 1000
  snapshot_every_epochs: 10
  val_every_epochs: 5
  val_batch_size: 32
  val_seed: 4321
  wandb: false
sample:
  ddim_steps: 30
  weights: ema
